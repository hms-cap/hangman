<!doctype html>
<html lang="en" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Games">
<meta name="theme-color" content="#102a43">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Chess Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="paper.css">
<script src="profiles.js"></script>
<script src="playtime.js"></script>
<style>
/* Board colours match Chess and Chess Puzzles */
:root{
  --sq-l:#f4f6f1; --sq-d:#b6c6d3; --sq-last:rgba(214,150,26,.40); --sq-sel:rgba(46,94,166,.42);
  --dot:rgba(29,38,45,.30); --check:rgba(196,53,61,.85); --coord-l:#7d8f9e; --coord-d:#f4f6f1;
  --pw-fill:#fbfbf6; --pw-line:#1d262d; --pb-fill:#27323b; --pb-line:#10171c; --pb-detail:#e9eef2; --pb-cross:#27323b;
  --good:#2f8a5b; --good-sq:rgba(47,138,91,.45); --bad-sq:rgba(196,53,61,.45); --warn-sq:rgba(214,150,26,.5);
  --star:#d9a03a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sq-l:#4d6b86; --sq-d:#2c4966; --sq-last:rgba(217,160,58,.45); --sq-sel:rgba(140,194,255,.45);
  --dot:rgba(8,16,24,.45); --check:rgba(255,110,110,.9); --coord-l:#c6d4e1; --coord-d:#93a9bd;
  --pw-fill:#f3f6f8; --pw-line:#0e1a26; --pb-fill:#0e1a26; --pb-line:#8ea5ba; --pb-detail:#a9bccd; --pb-cross:#d6e1ea;
  --good:#5cc08a; --good-sq:rgba(92,192,138,.45); --bad-sq:rgba(255,110,110,.45); --warn-sq:rgba(217,160,58,.5); --star:#e6b04c}}
:root[data-theme="dark"]{
  --sq-l:#4d6b86; --sq-d:#2c4966; --sq-last:rgba(217,160,58,.45); --sq-sel:rgba(140,194,255,.45);
  --dot:rgba(8,16,24,.45); --check:rgba(255,110,110,.9); --coord-l:#c6d4e1; --coord-d:#93a9bd;
  --pw-fill:#f3f6f8; --pw-line:#0e1a26; --pb-fill:#0e1a26; --pb-line:#8ea5ba; --pb-detail:#a9bccd; --pb-cross:#d6e1ea;
  --good:#5cc08a; --good-sq:rgba(92,192,138,.45); --bad-sq:rgba(255,110,110,.45); --warn-sq:rgba(217,160,58,.5); --star:#e6b04c}

.app{gap:9px}
.bar{grid-template-columns:auto minmax(0,1fr) auto}
.bar h1{font-size:1.8rem}
@media (max-width:440px){.back .txt{display:none}}
.iconbtn{justify-self:end;border:1px solid var(--key-edge);background:var(--key);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- map of tracks and levels ---- */
#mapView{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -16px;padding:0 16px 20px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.intro{margin:0;color:var(--muted);line-height:1.45}
.intro b{color:var(--ink)}
.track h2{font-family:var(--hand);font-weight:400;font-size:1.6rem;margin:0;line-height:1.05;display:flex;align-items:baseline;gap:8px}
.track h2 small{font-family:var(--ui);font-size:.75rem;color:var(--muted);font-weight:600;margin-left:auto;white-space:nowrap}
.track > p{margin:2px 0 8px;color:var(--muted);font-size:.86rem}
.lvls{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--key)}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px;cursor:pointer;color:var(--ink)}
.lv:last-child{border-bottom:0}
.lv .num{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:.9rem;border:2px solid var(--ink)}
.lv.passed .num{background:var(--ink);color:var(--paper)}
.lv.mastered .num{background:var(--star);border-color:var(--star);color:#fff}
/* opening lessons: one per named opening, listed under their repertoire level */
.subs{display:flex;flex-direction:column;border-bottom:1px solid var(--line);background:var(--peer);padding:2px 0 4px}
.subs:last-child{border-bottom:0}
.subs .sh{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 12px 2px 54px}
.sublv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:6px 12px 6px 54px;cursor:pointer;color:var(--ink);font-size:.9rem}
.sublv:active{background:var(--line)}
.sublv .dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.sublv.passed .dot{background:var(--ink)} .sublv.mastered .dot{background:var(--star);border-color:var(--star)}
.sublv .nm{flex:1;min-width:0;font-weight:600}
.sublv .nm small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.sublv.locked{cursor:default;color:var(--muted)} .sublv.locked .dot{border-color:var(--line)}
.sublv .stars svg{width:13px;height:13px}
.mpill{font-family:var(--ui);font-size:.68rem;font-weight:700;letter-spacing:.02em;color:var(--star);border:1px solid var(--star);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.mnote{margin:0;font-size:.86rem;color:var(--muted)} .mnote b{color:var(--ink)}
.lv .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lv .txt b{font-weight:600;font-size:.97rem}
.lv .txt small{color:var(--muted);font-size:.78rem;line-height:1.3}
.lv.locked{cursor:default;color:var(--muted)}
.lv.locked .num{border-color:var(--line);color:var(--muted)}
.lv .lock{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.stars{display:inline-flex;gap:1px;flex:none}
.stars svg{width:16px;height:16px}
.stars .on{fill:var(--star);stroke:var(--star)} .stars .off{fill:none;stroke:var(--line)}
.stars svg path{stroke-width:1.6;stroke-linejoin:round}
.stars.big svg{width:34px;height:34px}

/* ---- drill ---- */
#drillView{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.dstatus{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.dstatus .lname{font-family:var(--hand);font-size:1.25rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.cur{border-color:var(--ink)}
.dots i.ok{background:var(--good);border-color:var(--good)} .dots i.retry{background:var(--present);border-color:var(--present)} .dots i.miss{background:var(--miss);border-color:var(--miss)} .dots i.help{background:var(--star);border-color:var(--star)}
.clock{font-family:var(--mono);font-weight:600;font-size:.88rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--key);color:var(--ink);font-variant-numeric:tabular-nums}
.clock.low{color:var(--miss);border-color:var(--miss)}
.prompt{display:flex;align-items:center;gap:10px;min-height:42px}
.prompt .side{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:none}
.prompt .side.w{background:var(--pw-fill);border-color:var(--pw-line)} .prompt .side.b{background:var(--pb-fill);border-color:var(--pb-line)} .prompt .side.none{display:none}
.prompt .ptxt{display:flex;flex-direction:column;min-width:0}
.prompt .ptxt > b{font-family:var(--hand);font-weight:400;font-size:1.35rem;line-height:1.05}
.prompt .ptxt small{color:var(--muted);font-size:.8rem;line-height:1.3}

.boardWrap{flex:1 1 auto;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;position:relative}
.board{
  width:min(100cqw,100cqh);height:min(100cqw,100cqh);position:relative;container-type:size;
  display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));
  border:2px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none;
}
.sq{position:relative;min-width:0;min-height:0;contain:strict}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::before{background:var(--sq-last)}
.sq.sel::before{background:var(--sq-sel)}
.sq.good::before{background:var(--good-sq)}
.sq.bad::before{background:var(--bad-sq)}
.sq.warn::before{background:var(--warn-sq)}
.sq.trail::before{background:var(--sq-sel);opacity:.45}
.sq.guard::before{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--bad-sq) 5px 7px)}
.sq.hint{box-shadow:inset 0 0 0 .7cqw var(--present)}
.sq.pick::after,.sq.ring::after{content:"";position:absolute;inset:6%;border-radius:50%;border:.75cqw solid var(--hit);pointer-events:none}
.sq.ring.r-good::after{border-color:var(--good)} .sq.ring.r-bad::after{border-color:var(--miss)} .sq.ring.r-warn::after{border-color:var(--present);border-style:dashed}
.sq.check::before{background:radial-gradient(circle,var(--check) 0,transparent 72%)}
.sq .pc{position:absolute;inset:4%;width:92%;height:92%;pointer-events:none}
.sq .pc.lift{opacity:.25}
.sq .mv{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.sq .mv::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--dot)}
.sq .mv.cap::after{width:84%;height:84%;background:transparent;border:.9cqw solid var(--dot);box-sizing:border-box}
.sq .flag{position:absolute;inset:14%;width:72%;height:72%;pointer-events:none}
.sq .flag path{fill:var(--miss);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.sq .flag line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.sq .tag{position:absolute;top:3%;right:6%;font-family:var(--mono);font-weight:700;font-size:2.4cqw;line-height:1;color:var(--hit);pointer-events:none}
.sq .star{position:absolute;inset:16%;width:68%;height:68%;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite}
.sq .star path{fill:#f3c867;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
@keyframes twinkle{50%{transform:scale(.9) rotate(8deg)}}
.sq.nope{box-shadow:inset 0 0 0 .7cqw var(--miss)}
.why{color:var(--miss)}
.track .pill{font-family:var(--ui);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--hit);color:var(--paper);align-self:center}
.path{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--key);border:1.5px solid var(--ink)}
.path h2{margin:0;font-family:var(--hand);font-weight:400;font-size:1.55rem;line-height:1.05;display:flex;align-items:baseline;gap:8px}
.path h2 small{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.path p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.4}
.path .pbar{height:7px;border-radius:999px;background:var(--peer);overflow:hidden;border:1px solid var(--line)}
.path .pbar i{display:block;height:100%;background:var(--hit)}
.path .next{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--peer)}
.path .next .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.path .next .txt span{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.path .next .txt b{font-weight:600}
.path .row{display:flex;gap:8px;flex-wrap:wrap}
.path .row .btn{font-family:var(--ui);font-size:.9rem;font-weight:600;padding:8px 14px}
.path .linkbtn{border:0;background:transparent;padding:0;color:var(--hit);font-size:.84rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:4px 2px}
.steps li i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.7rem;font-weight:700}
.steps li.done i{background:var(--good);border-color:var(--good);color:#fff}
.steps li.cur{font-weight:600} .steps li.cur i{border-color:var(--hit)}
.steps li small{color:var(--muted);margin-left:auto;font-size:.74rem;white-space:nowrap}
.pathlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--key)}
.pathlist button{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px;cursor:pointer;color:var(--ink)}
.pathlist button:last-child{border-bottom:0}
.pathlist button b{font-weight:600} .pathlist button small{color:var(--muted);font-size:.8rem;line-height:1.35}
.pathlist button[aria-current="true"]{background:var(--peer)}
.result > .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tiers div{display:flex;flex-direction:column;gap:2px;padding:6px 2px;border-radius:10px;background:var(--peer)}
.tiers b{font-family:var(--mono);font-size:1.1rem;font-weight:500} .tiers span{font-size:.7rem;color:var(--muted)}
.tiers .ok b{color:var(--good)}
.lv .pstep{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--hit);color:var(--paper);vertical-align:2px;margin-left:4px}
.lv .opt{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:4px}
.track.beginner{border-left:3px solid var(--hit);padding-left:10px}
.sq .rk,.sq .fl{position:absolute;font-family:var(--mono);font-weight:600;font-size:2.1cqw;line-height:1;pointer-events:none}
.sq .rk{top:3%;left:4%} .sq .fl{bottom:3%;right:5%}
.sq.l .rk,.sq.l .fl{color:var(--coord-l)} .sq.d .rk,.sq.d .fl{color:var(--coord-d)}
.overlay{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.overlay line{stroke-width:1.6;stroke-linecap:round;opacity:.9}
.overlay .a-move{stroke:var(--present)} .overlay .a-good{stroke:var(--good)} .overlay .a-bad{stroke:var(--miss)} .overlay .a-path{stroke:var(--hit);stroke-dasharray:2.4 2}
.overlay .h-move{fill:var(--present)} .overlay .h-good{fill:var(--good)} .overlay .h-bad{fill:var(--miss)} .overlay .h-path{fill:var(--hit)}
.overlay rect.sqr{fill:rgba(46,94,166,.12);stroke:var(--hit);stroke-width:.9;stroke-dasharray:2 1.4}
.overlay rect.sqr.bad{fill:rgba(196,53,61,.10);stroke:var(--miss)}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-58%) scale(1.12);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.pc .pb{stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.pc.w .pb{fill:var(--pw-fill);stroke:var(--pw-line)} .pc.b .pb{fill:var(--pb-fill);stroke:var(--pb-line)}
.pc .pl{fill:none;stroke-width:1.3;stroke-linecap:round}
.pc.w .pl{stroke:var(--pw-line)} .pc.b .pl{stroke:var(--pb-detail)}
.pc .px{fill:none;stroke-width:2.3;stroke-linecap:round}
.pc.w .px{stroke:var(--pw-line)} .pc.b .px{stroke:var(--pb-cross)}
.promo{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--scrim)}
.promo[hidden]{display:none}
.promo div{display:flex;gap:8px;background:var(--sheet);padding:10px;border-radius:14px}
.promo button{width:64px;height:64px;border:1px solid var(--line);background:var(--sq-l);border-radius:10px;padding:4px;cursor:pointer}
.promo .pc{width:100%;height:100%}
.busy{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none}
.busy span{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.12)}

.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px;align-items:center}
.act .btn{font-family:var(--ui);font-size:.95rem;font-weight:600;padding:9px 16px}
.act .btn.ans{flex:1 1 0;min-width:0;white-space:normal;line-height:1.2;font-size:.9rem;padding:10px 8px}
.act .btn.opt{flex:1 1 calc(50% - 8px);min-width:0;white-space:normal;line-height:1.2;font-size:.86rem;padding:9px 8px}
.act .btn.opt.gone{visibility:hidden}
.onote{font-size:.84rem;line-height:1.35}
.onote b{font-family:var(--mono);font-weight:600}
.onote.bad b{color:var(--miss)}
.act .tool{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:.88rem}
.act .tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act .tool:disabled{opacity:.35;cursor:default}
.fb{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--sheet);border:1.5px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.08);animation:rise .2s ease-out}
.fb.ok{border-color:var(--good)} .fb.miss{border-color:var(--miss)} .fb.help{border-color:var(--star)} .fb.retry,.fb.again{border-color:var(--present)}
.fb.again h3,.fb.retry h3{color:var(--present)}
.fb.again .row{flex-wrap:wrap}
.fb .row .left{flex-basis:100%;color:var(--muted);font-size:.84rem;font-weight:600}
.fb h3{margin:0;font-family:var(--hand);font-weight:400;font-size:1.4rem;line-height:1.05}
.fb.ok h3{color:var(--good)} .fb.miss h3{color:var(--miss)} .fb.help h3{color:var(--star)}
.fb p{margin:0;line-height:1.42;font-size:.92rem}
.fb ul{margin:0;padding-left:18px;line-height:1.45;font-size:.9rem}
.fb .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fb .row .btn{font-family:var(--ui);font-size:.95rem;font-weight:600;padding:8px 18px}
.mono{font-family:var(--mono);font-weight:600}
.tally{font-family:var(--mono);font-size:.86rem;line-height:1.5}
.tally .p{color:var(--good)} .tally .m{color:var(--miss)}
.tip{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}

.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.result div{display:flex;flex-direction:column;gap:2px;align-items:center}
.result b{font-family:var(--mono);font-weight:500;font-size:1.3rem}
.lvinfo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.lvinfo b{color:var(--ink)}
@media (max-height:680px){.prompt .ptxt > b{font-size:1.15rem}.fb p{font-size:.86rem}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span class="txt">Games</span></a>
    <h1>Chess Trainer</h1>

<script>
'use strict';
const T = window.ChessTrainer, C = window.Chess, EG = window.ChessEndgames;
const { Position, WHITE, BLACK, mFrom, mTo, mFlags, mPromo, F_PROMO, F_CAP, colorOf, typeOf } = C;
const { pieceSVG } = window.ChessPieces;
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
let progress = store.get('trainer-progress', {});   // { track: { levelIndex: { stars, best, plays } } }
let settings = Object.assign({ clock: false, coords: true }, store.get('trainer-settings', {}));
let seen = store.get('trainer-seen', []);              // recently played fixed positions (tactics, mates)
const TL = ' pnbrqk', LETTER = { 1: 'p', 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };
const NAME = T.NAME, PTS = T.PTS;
const nm64 = T.nm64, to88 = T.to88, to64 = T.to64;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---------- level map ----------
const lvState = (tk, i) => (progress[tk] || {})[i] || null;
// Optional levels are always open and never block the next one; a required level needs the previous required level passed
const levelsOf = tk => T.TRACKS.find(t => t.key === tk).levels;
// ---- curriculum path: { key, checkpoints: { pathKey: { best, passed } }, placement: { path, tiers } }
let path = store.get('trainer-path', null);
const savePath = () => store.set('trainer-path', path);
const onPath = () => !!(path && path.key && T.PATHS.some(p => p.key === path.key)); // a placement result alone doesn't start a path
const stepDone = ([tk, i]) => !!((lvState(tk, i) || {}).stars > 0);
function pathInfo(key){
  const P = T.PATHS.find(p => p.key === key), steps = T.pathSteps(key), done = steps.filter(stepDone).length;
  const cur = steps.findIndex(st => !stepDone(st)), cp = ((path && path.checkpoints) || {})[key] || null;
  return { P, steps, done, cur, checkpoint: cp, complete: cur < 0 && !!(cp && cp.passed), ready: cur < 0 };
}
// the active path opens its steps up to the current one, whatever the group locks say
const pathOpens = (tk, i) => { if (!onPath()) return false; const pi = pathInfo(path.key), upto = pi.cur < 0 ? pi.steps.length - 1 : pi.cur; return pi.steps.some(([a, b], k) => k <= upto && a === tk && b === i); };
const pathStepNo = (tk, i) => { if (!onPath()) return 0; const k = pathInfo(path.key).steps.findIndex(([a, b]) => a === tk && b === i); return k + 1; };
const prevRequired = (tk, i) => { const ls = levelsOf(tk); for (let j = i - 1; j >= 0; j--) if (!ls[j].optional) return j; return -1; };
// Mastery: three stars, every drill right on the first try. Levels can be replayed as often as you like.
const mastered_ = (tk, i) => ((lvState(tk, i) || {}).stars || 0) >= 3;
const masteryNote = (tk, i) => { const st = lvState(tk, i), n = levelsOf(tk)[i].count;
  return mastered_(tk, i) ? '<b>Mastered.</b> Replay it any time to stay sharp.' : st && st.stars ? `Passed. <b>Master it</b> by getting all ${n} right first time.` : `Get all ${n} right first time to <b>master</b> it.`; };
// ---- opening lessons: each repertoire level split into one lesson per named opening, open once the level is ----
const lsState = key => ((progress.lessons || {})[key]) || null;
const lessonsOf = L => L.kind === 'oline' ? T.openingLessons(L.p.lvl) : [];
const lessonLabel = les => { const def = /Defence$/.test(les.fam), white = les.lvl.endsWith('w'), neutral = /Gambit (Declined|Accepted)/.test(les.fam);
  return !neutral && (white ? def : !def) ? `Against the ${les.fam}` : les.fam; };
const lessonFind = key => { for (const t of T.TRACKS) for (let i = 0; i < t.levels.length; i++){ const les = lessonsOf(t.levels[i]).find(x => x.key === key); if (les) return { tk: t.key, li: i, les, L: t.levels[i] }; } return null; };
const lessonCount = les => [les.lines.length && T.plural(les.lines.length, 'line'), les.traps.length && T.plural(les.traps.length, 'trap')].filter(Boolean).join(' + ');
function subList(tk, i, L, open){
  const ls = lessonsOf(L); if (!ls.length) return '';
  return `<div class="subs"><span class="sh">One opening at a time</span>` + ls.map(les => {
    const st = lsState(les.key), pass = st && st.stars > 0, mast = st && st.stars >= 3;
    return `<button class="sublv${pass ? ' passed' : ''}${mast ? ' mastered' : ''}${open ? '' : ' locked'}" type="button" data-sub="${esc(les.key)}"${open ? '' : ' aria-disabled="true"'}><i class="dot"></i><span class="nm">${esc(lessonLabel(les))}<small>${lessonCount(les)}</small></span>${open && st ? starRow(st.stars) : ''}</button>`;
  }).join('') + '</div>';
}
// What "next" means at the end of a level: the next level in the group, or the first level of the next group
function nextAfter(tk, li){
  const ti = T.TRACKS.findIndex(x => x.key === tk), t = T.TRACKS[ti];
  if (li + 1 < t.levels.length) return unlocked(tk, li + 1) ? { tk, li: li + 1, label: `Next level: ${t.levels[li + 1].name}` } : null;
  const nt = T.TRACKS[ti + 1];
  return nt && unlocked(nt.key, 0) ? { tk: nt.key, li: 0, label: `Next group: ${nt.name}` } : null;
}
const unlocked = (tk, i) => { if (levelsOf(tk)[i].optional || pathOpens(tk, i)) return true; const j = prevRequired(tk, i); return j < 0 || !!(lvState(tk, j) && lvState(tk, j).stars > 0); };
const required = t => t.levels.map((L, i) => [L, i]).filter(([L]) => !L.optional);
const starSVG = on => `<svg viewBox="0 0 24 24" class="${on ? 'on' : 'off'}"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>`;
const starRow = (n, big) => `<span class="stars${big ? ' big' : ''}" aria-label="${n} of 3 stars">${[1, 2, 3].map(k => starSVG(k <= n)).join('')}</span>`;
function drawPath(){
  const el = $('pathPanel');
  if (!onPath()){
    el.innerHTML = `<h2>Chess course</h2><p>Four paths, from first moves to advanced, each an ordered list of drills from every part of the trainer. Not sure where to start? The placement test takes about ten minutes.</p>
      <div class="row"><button class="btn primary" type="button" data-a="place">Take the placement test</button><button class="btn" type="button" data-a="choose">Choose a path</button></div>`;
    return;
  }
  const pi = pathInfo(path.key), n = pi.steps.length, pct = Math.round(100 * (pi.done + (pi.complete ? 1 : 0)) / (n + 1));
  const nm = ([tk, i]) => levelsOf(tk)[i].name, grp = ([tk]) => T.TRACKS.find(t => t.key === tk).name;
  let next;
  if (pi.complete){
    const nextP = T.PATHS[T.PATHS.findIndex(p => p.key === path.key) + 1];
    next = `<div class="next"><div class="txt"><span>Path complete</span><b>${nextP ? `Next: the ${nextP.name} path` : 'You\'ve finished the course'}</b></div>${nextP ? `<button class="btn primary small" type="button" data-a="start" data-p="${nextP.key}">Start</button>` : ''}</div>`;
  } else if (pi.ready){
    const cp = pi.checkpoint;
    next = `<div class="next"><div class="txt"><span>Last step</span><b>Checkpoint: ${T.checkpointSpec(path.key).length} mixed drills</b>${cp ? `<small>Best ${cp.best}/${T.checkpointSpec(path.key).length}</small>` : ''}</div><button class="btn primary small" type="button" data-a="checkpoint">Go</button></div>`;
  } else {
    const st = pi.steps[pi.cur];
    next = `<div class="next"><div class="txt"><span>Step ${pi.cur + 1} of ${n} · ${esc(grp(st))}</span><b>${esc(nm(st))}</b></div><button class="btn primary small" type="button" data-a="step" data-t="${st[0]}" data-i="${st[1]}">Go</button></div>`;
  }
  const list = pi.steps.map((st, k) => `<li class="${stepDone(st) ? 'done' : k === pi.cur ? 'cur' : ''}"><i>${stepDone(st) ? '✓' : k + 1}</i>${esc(nm(st))}<small>${esc(grp(st))}</small></li>`).join('')
    + `<li class="${pi.complete ? 'done' : pi.ready ? 'cur' : ''}"><i>${pi.complete ? '✓' : n + 1}</i>Checkpoint<small>Mixed</small></li>`;
  el.innerHTML = `<h2>${esc(pi.P.name)} path<small>${pi.done}/${n}${pi.complete ? ' ✓' : ''}</small></h2><div class="pbar"><i style="width:${pct}%"></i></div>${next}
    <details${pathOpenList ? ' open' : ''} id="pathDetails"><summary class="linkbtn">All steps</summary><ul class="steps">${list}</ul></details>
    <div class="row"><button class="linkbtn" type="button" data-a="choose">Change path</button><button class="linkbtn" type="button" data-a="place">Placement test</button></div>`;
}
let pathOpenList = false;
$('pathPanel').addEventListener('toggle', e => { if (e.target.id === 'pathDetails') pathOpenList = e.target.open; }, true);
$('pathPanel').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'place') startPlacement();
  else if (a === 'choose') openPaths();
  else if (a === 'start') setPath(b.dataset.p);
  else if (a === 'checkpoint') startCheckpoint(path.key);
  else if (a === 'step') openLevel(b.dataset.t, +b.dataset.i);
});
function setPath(key){ path = Object.assign({ checkpoints: {} }, path || {}, { key }); savePath(); close(); drawMap(); $('mapView').scrollTop = 0; }
function openPaths(){
  const sug = path && path.placement && path.placement.path;
  $('pathList').innerHTML = T.PATHS.map(P => { const pi = pathInfo(P.key);
    return `<button type="button" data-p="${P.key}"${onPath() && path.key === P.key ? ' aria-current="true"' : ''}><b>${esc(P.name)}${pi.complete ? ' ✓' : ''}${sug === P.key ? ' <span class="opt">Suggested</span>' : ''}</b><small>${esc(P.blurb)} ${pi.steps.length} steps${pi.done ? `, ${pi.done} done` : ''}.</small></button>`; }).join('');
  open('pathSheet');
}
$('pathList').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b) setPath(b.dataset.p); });
$('pathClose').addEventListener('click', close);
$('placeGo').addEventListener('click', () => { close(); startPlacement(); });

function drawMap(){
  drawPath();
  const total = T.TRACKS.reduce((n, t) => n + required(t).length, 0);
  const passed = T.TRACKS.reduce((n, t) => n + required(t).filter(([, i]) => (lvState(t.key, i) || {}).stars > 0).length, 0);
  const mastered = T.TRACKS.reduce((n, t) => n + t.levels.filter((_, i) => mastered_(t.key, i)).length, 0);
  $('intro').innerHTML = passed
    ? `<b>${passed} of ${total}</b> levels passed${mastered ? `, <b>${mastered}</b> mastered` : ''}. Pass a level to unlock the next one in its group; replay any level as often as you like to master it (every drill right first time).`
    : 'New to chess? Start with <b>Learn the moves</b>: how each piece moves, then check, checkmate and the special moves. The other groups are short drills for the skills you use in real games. Pass a level to unlock the next.';
  $('tracks').innerHTML = T.TRACKS.map(t => {
    const req = required(t), done = req.filter(([, i]) => (lvState(t.key, i) || {}).stars > 0).length;
    return `<section class="track${t.beginner ? ' beginner' : ''}"><h2>${t.name}${t.beginner ? '<span class="pill">Beginners</span>' : ''}<small>${done}/${req.length}</small></h2><p>${t.blurb}</p><div class="lvls">` +
      t.levels.map((L, i) => {
        const st = lvState(t.key, i), open = unlocked(t.key, i), pass = st && st.stars > 0, mast = mastered_(t.key, i);
        return `<button class="lv${pass ? ' passed' : ''}${mast ? ' mastered' : ''}${open ? '' : ' locked'}" type="button" data-t="${t.key}" data-i="${i}"${open ? '' : ' aria-disabled="true"'}>
          <span class="num">${i + 1}</span>
          <span class="txt"><b>${L.name}${mast ? '<span class="mpill">Mastered</span>' : ''}${L.optional ? ' <span class="opt">Optional</span>' : ''}${pathStepNo(t.key, i) ? ` <span class="pstep">Step ${pathStepNo(t.key, i)}</span>` : ''}</b><small>${open ? L.about : pathStepNo(t.key, i) ? 'A later step in your path' : `Pass level ${prevRequired(t.key, i) + 1} to unlock`}</small></span>
          ${open ? (st ? starRow(st.stars) : '') : '<svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'}
        </button>` + subList(t.key, i, L, open);
      }).join('') + '</div></section>';
  }).join('');
}
const TIPS = {
  kpath: 'A knight always changes square colour. Two squares that are diagonal neighbours take two moves; a corner square next to its neighbour on the diagonal takes four.',
  grab: 'Plan the whole tour before the first move. Grabbing the nearest pawn first is often not the shortest way round.',
  loose: 'For each black piece ask: who attacks it, who defends it, and is my cheapest attacker worth less than what it takes?',
  count: 'List the attackers from cheapest to dearest on both sides. Each side can stop capturing whenever carrying on would lose.',
  square: 'Draw a square from the pawn to the last rank. A pawn on its starting square counts its double step. If the king can get into the square, it catches the pawn.',
  tactic: 'Look for checks, captures and threats. A move that attacks two things at once, or a line with something valuable behind, is a target.',
  mate: 'Checks first, then captures, then quiet moves. For every move you try, look at all of the opponent\'s replies.',
  egQ: 'Use the queen a knight\'s move away from the king to shrink its box, then bring your own king up. Always check the defender still has a move.',
  egR: 'Rook cuts off the king along a rank or file; your king faces the enemy king (opposition) and then the rook checks it back a line. Waiting moves with the rook keep the box.',
  egPW: 'Get your king in front of the pawn. Kings facing each other with one square between: whoever is not to move has the opposition. A rook pawn is usually a draw.',
  egPD: 'Stay in front of the pawn. When the white king comes forward, step into the opposition. When the pawn reaches your second-to-last rank in front of your king, step straight back.',
};
const tipFor = L => L.tip ? L.tip : L.kind === 'eg' ? TIPS[L.p.piece === 'Q' ? 'egQ' : L.p.piece === 'R' ? 'egR' : L.p.win ? 'egPW' : 'egPD'] : TIPS[L.kind];

let chosen = null;
$('tracks').addEventListener('click', e => {
  const sb = e.target.closest('.sublv'); if (sb){ if (!sb.classList.contains('locked')) openLesson(sb.dataset.sub); return; }
  const b = e.target.closest('.lv'); if (!b || b.classList.contains('locked')) return;
  openLevel(b.dataset.t, +b.dataset.i);
});
function openLevel(tk, i){
  const t = T.TRACKS.find(x => x.key === tk), L = t.levels[i], st = lvState(tk, i);
  chosen = { tk, i };
  $('lvTrack').textContent = `${t.name} · level ${i + 1}`;
  $('lvTitle').textContent = L.name; $('lvAbout').textContent = L.about;
  const clock = settings.clock && L.clock ? ` · <b>${L.clock}s</b> each` : '';
  $('lvInfo').innerHTML = `<span><b>${L.count}</b> drills · pass with <b>${L.pass}</b>${clock}</span>` + (st ? `<span>Best <b>${st.best}/${L.count}</b> ${starRow(st.stars)}</span>` : '') + `<p class="mnote">${masteryNote(tk, i)}</p>`;
  $('lvTip').textContent = tipFor(L);
  if (lessonsOf(L).length) $('lvInfo').innerHTML += '<p class="mnote">Or take it <b>one opening at a time</b>: the lessons are listed under this level.</p>';
  $('lvGo').textContent = !st ? 'Start' : mastered_(tk, i) ? 'Play again' : st.stars ? 'Try for mastery' : 'Try again';
  open('lvSheet');
}
function openLesson(key){
  const f = lessonFind(key); if (!f) return;
  const { les, L } = f, st = lsState(key), t = T.TRACKS.find(x => x.key === f.tk);
  chosen = { lesson: key };
  $('lvTrack').textContent = `${t.name} · ${L.name}`;
  $('lvTitle').textContent = lessonLabel(les); $('lvAbout').textContent = les.about;
  $('lvInfo').innerHTML = `<span>${lessonCount(les)}: play ${les.count === 1 ? 'it' : 'each'} through with the idea behind every move${les.traps.length ? ', then punish the classic mistake' : ''}</span>` + (st ? `<span>Best <b>${st.best}/${les.count}</b> ${starRow(st.stars)}</span>` : '') +
    `<p class="mnote">${st && st.stars >= 3 ? '<b>Mastered.</b> Replay it any time to stay sharp.' : `Get ${les.count === 1 ? 'it' : `all ${les.count}`} right first time to <b>master</b> it.`}</p>`;
  $('lvTip').textContent = L.tip;
  $('lvGo').textContent = !st ? 'Start' : st.stars >= 3 ? 'Play again' : st.stars ? 'Try for mastery' : 'Try again';
  open('lvSheet');
}
$('lvGo').addEventListener('click', () => { close(); chosen.lesson ? startLesson(chosen.lesson) : startLevel(chosen.tk, chosen.i); });
$('lvCancel').addEventListener('click', close);

// ---------- sheets ----------
function open(id){ document.querySelectorAll('.sheet:not(.gnav)').forEach(s => s.hidden = s.id !== id); }
function close(){ document.querySelectorAll('.sheet:not(.gnav)').forEach(s => s.hidden = true); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s && s.id !== 'resSheet') close(); }));
$('setBtn').addEventListener('click', () => { $('setClock').checked = settings.clock; $('setCoords').checked = settings.coords; $('setReset').textContent = 'Reset all progress'; open('setSheet'); });
$('setClose').addEventListener('click', close);
$('setClock').addEventListener('change', e => { settings.clock = e.target.checked; store.set('trainer-settings', settings); });
$('setCoords').addEventListener('change', e => { settings.coords = e.target.checked; store.set('trainer-settings', settings); if (D) render(); });
let resetArmed = null;
$('setReset').addEventListener('click', () => {
  const b = $('setReset');
  if (resetArmed){ clearTimeout(resetArmed); resetArmed = null; progress = {}; store.set('trainer-progress', progress); b.textContent = 'Progress reset'; drawMap(); return; }
  b.textContent = 'Tap again to reset'; resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Reset all progress'; }, 3000);
});

// ---------- endgame tables (built in a worker on first use) ----------
const tablesReady = {};
function needTables(kind){
  if (tablesReady[kind]) return tablesReady[kind];
  const kinds = kind === 'P' ? ['Q', 'R', 'P'] : [kind];

    const inMain = () => { kinds.forEach(k => EG.tables(k)); resolve(); };

  const S = `<span class="mono">${esc(san)}</span>`, st = p.status();
  if (st) return st.reason === 'stalemate' ? `<p>${S} is stalemate: your opponent has no legal move and isn't in check, so it's a draw.</p>` : `<p>${S} ends the game in a draw.</p>`;
  const check = p.inCheck(), sm = C.scoreMoves(p, 3), r = sm[0]; if (!r) return '';
  const R = `<span class="mono">${esc(p.san(r.move))}</span>`, capT = (mFlags(r.move) & F_CAP) ? typeOf(p.b[mTo(r.move)]) : 0;
  if (r.score > C.MATE - 100) return `<p>${S} walks into a mating attack: ${R} starts it.</p>`;
  if (isMate) return `<p>${S} ${check ? `is check, but your opponent answers ${R}` : `isn't forcing enough: your opponent answers ${R}`}${capT && !check ? ` and takes your ${NAME[capT]}` : ''}, and there's no mate.</p><p class="tip">In a mate puzzle, look at checks first, then captures.</p>`;
  if (capT){
    if (took && mTo(r.move) === mTo(m)) return PTS[capT] > PTS[took]
      ? `<p>${S} takes a ${NAME[took]}, but ${R} wins your ${NAME[capT]} back: you lose material.</p>`
      : `<p>${S} takes a ${NAME[took]}, but ${R} takes back: just a trade.</p>`;
    // was that piece already loose before the move? then the move simply didn't deal with it
    const q = new Position(p0.fen()); q.makeNull();
    const already = q.legal().some(x => mTo(x) === mTo(r.move) && (mFlags(x) & F_CAP));
    return already ? `<p>${S} leaves your ${NAME[capT]} on ${nm64(to64(mTo(r.move)))} hanging: ${R} takes it.</p>`
      : `<p>After ${S}, your opponent plays ${R} and wins your ${NAME[capT]}.</p>`;
  }
  const tip = '<p class="tip">Look for a move that attacks two things at once, or a piece that can\'t move because something more valuable stands behind it.</p>';
  if (took) return `<p>${S} wins a ${NAME[took]}, but there's a move here that wins more. Your opponent answers ${R}.</p>` + tip;
  return `<p>${S} doesn't win material: your opponent answers ${R}.</p>` + tip;
}

// ---------- tap / drag input ----------
let drag = null;
$('board').addEventListener('pointerdown', e => {

function selectSq(c, s){

}
function tryMove(c, s){

// shared bits for move-based controllers
function moveView(c, extra){

  if (c.last){ v.cls[c.last[0]] = 'last'; v.cls[c.last[1]] = 'last'; }
  if (c.mark) v.cls[c.mark[0]] = (v.cls[c.mark[0]] || '') + ' ' + c.mark[1];

function play(c, m, mark){

const sideName = s => s === WHITE ? 'White' : 'Black';

// ---------- controllers ----------
const PIECE_NAME = { R: 'rook', B: 'bishop', Q: 'queen', K: 'king', N: 'knight', P: 'pawn' };
const CTL = {
  // Beginners: one piece collects stars (and captures black pieces that stand still); the board shows where it can go
  route(it){
    const items = it.stars.concat(it.targets), full = (1 << items.length) - 1, blockers = new Set(it.blockers), pname = PIECE_NAME[it.piece];
    const c = { cur: it.from, n: 0, got: 0, trail: [it.from], hint: null, note: '', nope: null, reveal: false };
    const leftTargets = () => new Set(it.targets.filter((_, j) => !(c.got & (1 << (it.stars.length + j)))));
    const leftStars = () => it.stars.filter((_, j) => !(c.got & (1 << j)));
    const best = () => `The fewest is ${T.plural(it.min, 'move')}: <span class="mono">${it.path.map(nm64).join(' → ')}</span>.`;
    const fail = (title, why) => wrong(title, `<p>${why}</p><p>Try another route: the ${pname} starts again from ${nm64(it.from)}.</p>`,
      () => { c.reveal = true; resolve(false, title, `<p>${why}</p><p>${best()}</p>`); });
    const what = it.capture ? 'every black piece' : it.stars.length === 1 && !it.targets.length ? 'the star' : 'all the stars';
    return Object.assign(c, {
      prompt(){
        const title = it.capture ? `Capture every black piece with the ${pname}` : `Collect ${what} with the ${pname}` + (it.targets.length ? ' (capture to get there)' : '');
        const sub = c.note ? `<span class="why">${c.note}</span>` : `Tap a dotted square to move. Moves: <b>${c.n}</b> · allowed: <b>${it.limit}</b> (the fewest is ${it.min})`;
        return { title, sub, side: null };
      },
      view(){
        const v = { pieces: {}, cls: {}, tags: {}, arrows: [], dots: new Set(), stars: new Set(leftStars()) };
        blockers.forEach(s => v.pieces[s] = it.piece === 'P' ? 'N' : 'P'); // obstacles: your own pieces (knights in the pawn lesson, so your pawn stands out)
        v.cls[it.from === c.cur && !c.n ? c.cur : c.cur] = 'sel';
        it.targets.forEach((s, j) => { if (leftTargets().has(s)) v.pieces[s] = it.targetKinds[j]; });
        v.pieces[c.cur] = it.piece;
        c.trail.forEach((s, k) => { if (k && s !== c.cur) { v.cls[s] = 'trail'; v.tags[s] = k; } });
        if (!D.done) T.routeMoves(it.piece, c.cur, blockers, leftTargets()).forEach(s => v.dots.add(s));
        if (c.hint != null) v.cls[c.hint] = (v.cls[c.hint] || '') + ' hint';
        if (c.nope != null) v.cls[c.nope] = (v.cls[c.nope] || '') + ' nope';
        if (c.reveal) for (let k = 1; k < it.path.length; k++) v.arrows.push([it.path[k - 1], it.path[k], 'path']);
        return v;
      },
      tap(s){
        if (s === c.cur) return;
        const ok = T.routeMoves(it.piece, c.cur, blockers, leftTargets());
        if (!ok.includes(s)){ c.note = T.routeWhy(it.piece, c.cur, s, blockers, leftTargets()); c.nope = s; render(); return; }
        const from = c.cur; c.note = ''; c.nope = null; c.hint = null; c.n++; c.cur = s; c.trail.push(s);
        const j = items.indexOf(s), took = j >= it.stars.length;
        if (j >= 0) c.got |= 1 << j;

        if (took) try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
        if (c.got === full){
          const perfect = c.n === it.min;
          return resolve(true, perfect ? 'Perfect!' : 'Well done', `<p>${it.capture ? 'All captured' : 'All the stars'} in ${T.plural(c.n, 'move')}${perfect ? ': the fewest possible.' : `. ${best()}`}</p>`);
        }
        if (c.n >= it.limit) return fail('Out of moves', `That's ${T.plural(c.n, 'move')}, and there ${items.length - [...Array(items.length).keys()].filter(k => c.got & (1 << k)).length === 1 ? 'is still one' : 'are still some'} to go.`);
        if (!T.routeMoves(it.piece, c.cur, blockers, leftTargets()).length) return fail('Stuck', `The ${pname} has no moves left from ${nm64(c.cur)}${it.piece === 'P' ? ': pawns can\'t go back' : ''}.`);

      hint(){ const sol = T.routeSolve(it, c.cur, c.got); c.hint = sol && sol.path[1]; c.note = ''; },

  },

  // Beginners: give check, get out of check, mate in one, castling, promotion and en passant on a real position
  goal(it){
    const pos = new Position(it.fen), c = { pos, me: WHITE, flip: false, moves: true, sel: -1, targets: new Map(), hintSq: null, arrows: null };
    if (it.last) c.last = [it.last.slice(0, 2), it.last.slice(2, 4)].map(x => to64(C.sqFrom(x)));
    const ans = new Set(it.answers), sansOf = list => list.map(u => pos.san(pos.fromUci(u)));
    const goodSans = sansOf(it.answers), list = a => a.map(x => `<span class="mono">${esc(x)}</span>`).join(', ');
    const WAY = { king: 'moving the king', capture: 'capturing the piece giving check', block: 'blocking: putting a piece in between' };
    const arrowsFor = us => us.slice(0, 3).map(u => [to64(C.sqFrom(u.slice(0, 2))), to64(C.sqFrom(u.slice(2, 4))), 'good']);
    const last0 = c.last;

      const u = Position.uci(m), before = new Position(pos.fen()), san = before.san(m), ok = ans.has(u);

      const S = `<span class="mono">${esc(san)}</span>`;

        text = ok ? `<p>${S} attacks the black king: that's <b>check</b>. Black has to get out of it on the very next move. In chess notation a check gets a +.</p>`
                  : (why = `<p>${S} doesn't attack the black king. A check is a move that attacks the king: look at what each of your pieces could reach.</p>`, sol = `<p>Check${goodSans.length > 1 ? 's' : ''} here: ${list(goodSans)}</p>`, '');

                  : (why = `<p>${S} does get out of check, by ${WAY[way]}. This time the task was ${WAY[it.way]}.</p>`, sol = `<p>${list(goodSans)}</p>`, '');

        else { const esc1 = pos.inCheck() ? pos.legal()[0] : null;

      } else if (it.goal === 'castle'){

                  : (why = `<p>That wasn't castling ${side}.${it.why ? ` (The other side isn't allowed: ${it.why})` : ''}</p>`, sol = `<p>Tap the king, then ${it.side === 'k' ? 'g1' : 'c1'}, two squares toward the rook.</p>`, '');
      } else if (it.goal === 'promote'){
        text = ok ? `<p>${S}: the pawn reaches the last row and becomes a <b>queen</b>.</p>`
                  : (why = (mFlags(m) & F_PROMO) ? `<p>${S} promotes, but to a smaller piece. A queen is the strongest choice.</p>` : `<p>${S} doesn't promote: a pawn becomes a new piece when it reaches the last row.</p>`, sol = `<p>${list(goodSans)}</p>`, '');
      } else if (it.goal === 'ep'){

      prompt(){

          mate: ['Checkmate in one', 'Find the check that leaves the king no way out.'],
          castle: [it.ask === 'any' ? 'Castle on the side where it\'s allowed' : `Castle ${it.side === 'k' ? 'kingside (the short side)' : 'queenside (the long side)'}`, 'Tap the king, then the square two steps toward the rook.'],
          promote: ['Promote the pawn to a queen', 'Move it to the last row, then choose the queen.'],
          ep: ['Capture en passant', 'Black\'s pawn has just moved two squares (the marked move).'],
        }[it.goal];
        return { title: P[0], sub: P[1], side: WHITE };
      },
      view(){ const v = moveView(c); if (it.goal === 'escape' && !D.done) v.cls[it.checker] = (v.cls[it.checker] || '') + ' ring r-bad'; return v; },
      hint(){ c.hintSq = to64(C.sqFrom(it.answers[0].slice(0, 2))); },
    });
  },

  // Knight to the flag in the fewest moves
  kpath(it){
    const base = it.fen ? posPieces(new Position(it.fen)) : Object.assign({}, it.pieces);
    delete base[it.from];
    const forb = new Set(it.forbidden), c = { cur: it.from, n: 0, trail: [it.from], hint: null, reveal: false };

      prompt: () => ({ title: `Knight to the flag in ${T.plural(it.min, 'move')}`, sub: it.forbidden.length ? 'Never land on a piece or on a square a black piece or pawn attacks.' : `Tap the squares the knight jumps to. Moves so far: <b>${c.n}</b>.`, side: null }),
      view(){

        if (!D.done) T.KNIGHT[c.cur].forEach(s => v.dots.add(s));
        if (c.hint != null) v.cls[c.hint] = (v.cls[c.hint] || '') + ' hint';

      },

            : by != null ? `${nm64(s)} is attacked by the ${NAME[' pnbrqk'.indexOf(base[by].toLowerCase())]} on ${nm64(by)}.` : `${nm64(s)} is attacked by a black piece.`);

        if (c.n >= it.min) return fail('Too many moves', `That's ${T.plural(c.n, 'move')} and the knight isn't there yet. Count the route out before the first move: from ${nm64(it.from)} the flag is ${T.plural(it.min, 'move')} away.`);

      hint(){ const p = T.knightPath(c.cur, it.to, forb.size ? forb : null); c.hint = p && p[1]; },

    const best = `Best order: <span class="mono">${it.order.map(nm64).join(', ')}</span>, ${T.plural(it.min, 'move')}.` + (it.greedy > it.min ? ` Taking the nearest pawn each time costs ${it.greedy}.` : '');
    const fail = why => wrong('Too many moves', `<p>${why}</p><p>Think about the order: which pawn should come first so the others are close together?</p>`,
      () => { c.reveal = true; resolve(false, 'Too many moves', `<p>${why}</p><p>${best}</p>`); });
    return Object.assign(c, {
      prompt: () => ({ title: `Take every pawn in ${T.plural(it.min, 'move')}`, sub: `Pawns left: <b>${left.size}</b> · moves used: <b>${c.n}</b>`, side: null }),
      view(){
        const v = { pieces: { [c.cur]: 'N' }, cls: {}, tags: {}, arrows: [], dots: new Set() };
        left.forEach(s => v.pieces[s] = 'p');
        c.trail.forEach((s, k) => { if (k && s !== c.cur) { v.cls[s] = 'trail'; v.tags[s] = k; } });
        if (!D.done) T.KNIGHT[c.cur].forEach(s => v.dots.add(s));
        if (c.hint != null) v.cls[c.hint] = (v.cls[c.hint] || '') + ' hint';
        if (c.reveal){ let a = it.from; for (const t of it.order){ const p = T.knightPath(a, t); for (let k = 1; k < p.length; k++) v.arrows.push([p[k - 1], p[k], 'path']); a = t; } }
        return v;
      },
      tap(s){
        if (!T.KNIGHT[c.cur].includes(s)) return;
        c.n++; c.hint = null; c.cur = s; c.trail.push(s); left.delete(s);
        if (!left.size) return c.n === it.min ? resolve(true, 'Correct', `<p>All pawns in ${T.plural(c.n, 'move')}. ${it.greedy > it.min ? `Grabbing the nearest one first would have taken ${it.greedy}.` : ''}</p>`) : fail(`You took ${c.n}.`);
        if (c.n >= it.min) return fail(`That's ${T.plural(c.n, 'move')} with ${T.plural(left.size, 'pawn')} still on the board.`);
        render();
      },
      hint(){ const plan = T.grabPlan(c.cur, [...left]), p = T.knightPath(c.cur, plan.order[0]); c.hint = p[1]; },
      timeout(){ fail('Time is up.'); },
    });
  },

  // Tap every black piece White can win
  loose(it){
    const pos = new Position(it.fen), picks = new Set(), c = { reveal: false, hintN: false };
    const check = () => {
      const ans = new Set(it.answers), ok = picks.size === ans.size && [...picks].every(s => ans.has(s));
      const lines = [];
      for (const s of it.answers){ const w = it.why[s]; lines.push(`<li><span class="mono">${esc(w.san)}</span> wins the ${NAME[typeOf(pos.b[to88(s)])]}` + (w.line.length > 1 ? ` (<span class="mono">${w.line.map(esc).join(' ')}</span>)` : '') + `: <b>+${w.gain}</b>${picks.has(s) ? '' : ' <i>missed</i>'}</li>`); }
      for (const s of picks) if (!ans.has(s)){
        const caps = T.capturesOn(pos, to88(s)), name = NAME[typeOf(pos.b[to88(s)])];
        if (!caps.length) lines.push(`<li>The ${name} on ${nm64(s)} isn't attacked.</li>`);
        else { let best = caps[0], bv = -99; for (const m of caps){ const v = T.seeMove(pos, m); if (v > bv){ bv = v; best = m; } }
          const line = T.exchangeLine(pos, best).map(x => x.san);
          lines.push(`<li>The ${name} on ${nm64(s)} is safe: <span class="mono">${line.map(esc).join(' ')}</span> ${bv === 0 ? 'is only a trade' : `loses ${-bv}`}.</li>`); }
      }
      if (ok) return resolve(true, 'Correct', `<ul>${lines.join('')}</ul>`);
      // another go: explain the wrong picks, only count the missed ones
      const wrongLines = [], missed = it.answers.filter(s => !picks.has(s)).length;
      for (const s of picks) if (!ans.has(s)) wrongLines.push(lines.find(l => l.includes(`on ${nm64(s)} `)) || '');
      if (missed) wrongLines.push(`<li>${missed === 1 ? 'One piece that can be won is' : `${missed} pieces that can be won are`} still unpicked.</li>`);
      c.reveal = false;
      wrong('Not quite', `<ul>${wrongLines.join('')}</ul>`, () => { c.reveal = true; resolve(false, 'Not quite', `<ul>${lines.join('')}</ul>`); },
        () => { for (const s of [...picks]) if (!ans.has(s)) picks.delete(s); });
    };
    return Object.assign(c, {
      prompt: () => ({ title: 'Which black pieces can White win?', side: WHITE,
        sub: c.hintN ? `There ${it.answers.length === 1 ? 'is <b>one</b>' : `are <b>${it.answers.length}</b>`} to find.` : 'Tap each one, then Done. A piece counts if White can take it and stay ahead after the recaptures.' }),
      view(){
        const v = { pieces: posPieces(pos), cls: {}, arrows: [] };
        picks.forEach(s => v.cls[s] = 'pick');
        if (c.reveal){ for (const s of it.answers) v.cls[s] = 'ring ' + (picks.has(s) ? 'r-good' : 'r-warn'); for (const s of picks) if (!it.answers.includes(s)) v.cls[s] = 'ring r-bad';
          for (const s of it.answers){ const u = it.why[s].san; const m = pos.legal().find(x => pos.san(x) === u); if (m) v.arrows.push([to64(mFrom(m)), to64(mTo(m)), 'good']); } }
        return v;
      },
      tap(s){ const p = pos.b[to88(s)]; if (!p || colorOf(p) !== BLACK || typeOf(p) === 6) return; picks.has(s) ? picks.delete(s) : picks.add(s); render(); },
      buttons: () => [{ label: 'Done', cls: 'primary', run: check }],
      hint(){ c.hintN = true; },
      timeout(){ check(); },
    });
  },

  // White captures; after all sensible recaptures, who is ahead?
  count(it){
    const pos = new Position(it.fen), m0 = pos.fromUci(it.move), c = { shown: false, hl: null, step: -1, gone: new Set() };
    const answer = a => {
      const ok = a === it.answer;
      if (!ok && a != null){
        const S = `<span class="mono">${esc(it.san)}</span>`, re = it.line[1] && `<span class="mono">${esc(it.line[1].san)}</span>`;
        const why = a === 'win' ? `<p>White doesn't come out ahead. After ${S}, Black can recapture with ${re}: keep counting what each side takes.</p>`
          : a === 'lose' ? `<p>White doesn't lose material here. Look at who runs out of captures first, and whether the side that would lose stops taking.</p>`
          : it.net > 0 ? `<p>It's better than an even trade for White: check whether Black can really afford to take back every time.</p>`
          : `<p>It's worse than an even trade for White: add up the value of what each side gives up, not just the number of captures.</p>`;
        c.gone.add(a);
        if (c.gone.size < 2 && wrong('Not quite', why, w => finalAnswer(false, w), () => {})) return; // with one choice left a retry would give it away
        if (c.gone.size >= 2){ D.tries[D.k] = maxTries(); return finalAnswer(false, why); }
        return;
      }
      finalAnswer(ok, '');
    };
    const finalAnswer = (ok, pre) => {
      let tot = 0;
      const rows = it.line.map(x => { const g = PTS[x.took] * (x.side === WHITE ? 1 : -1); tot += g; return `<span class="mono">${esc(x.san)}</span> <span class="${g > 0 ? 'p' : 'm'}">${g > 0 ? '+' : ''}${g}</span>`; });
      const verdict = it.net > 0 ? `White comes out <b>${it.net} up</b>.` : it.net < 0 ? `White ends up <b>${-it.net} down</b>.` : 'It is an <b>even trade</b>.';
      const stop = it.line.length % 2 === 1 && it.line.length > 1 ? ' Black stops recapturing because the next capture would lose more.' : it.line.length % 2 === 0 && it.line.length > 2 ? ' White stops there: taking again would lose material.' : '';
      c.shown = true;
      resolve(ok, ok ? 'Correct' : 'Not quite', `${pre || ''}<p class="tally">${rows.join(' · ')}</p><p>${verdict}${stop}</p>`);
      replay();
    };
    const replay = async () => { const p = new Position(it.fen); D.busy = true; for (const x of it.line){ await wait(650); if (!D || D.ctl !== c) return; const m = p.legal().find(y => p.san(y) === x.san); if (!m) break; p.make(m); c.p = p; c.lastMv = [to64(mFrom(m)), to64(mTo(m))]; render(c.lastMv); } D.busy = false; };
    return Object.assign(c, {
      prompt: () => ({ title: `White plays ${it.san}. Who ends up ahead?`, sub: 'Count the captures on that square, cheapest first. Either side may stop.', side: WHITE }),
      view(){
        const p = c.p || pos, v = { pieces: posPieces(p), cls: { [it.target]: 'ring r-warn' }, arrows: [] };
        if (!c.p) v.arrows.push([to64(mFrom(m0)), to64(mTo(m0)), 'move']);
        if (c.lastMv){ v.cls[c.lastMv[0]] = 'last'; }
        if (c.hl) c.hl.forEach(s => v.cls[s] = (v.cls[s] || '') + ' hint');
        return v;
      },
      buttons: () => [
        { label: 'White wins material', cls: 'ans', disabled: c.gone.has('win'), run: () => answer('win') },
        { label: 'Even trade', cls: 'ans', disabled: c.gone.has('even'), run: () => answer('even') },
        { label: 'White loses material', cls: 'ans', disabled: c.gone.has('lose'), run: () => answer('lose') }],
      hint(){ const p = new Position(it.fen), out = []; for (const x of it.line){ const m = p.legal().find(y => p.san(y) === x.san); if (!m) break; out.push(to64(mFrom(m))); p.make(m); } c.hl = out; },
      timeout(){ answer(null); },
    });
  },

  // Rule of the square
  square(it){
    const pos = new Position(it.fen), c = { sq: false };
    const pf = it.pawn & 7, n = it.n, r0 = 7 - n, rect = () => [Math.max(0, pf - n), r0, Math.min(7, pf + n), 7, D.done && !it.catches ? 'bad' : ''];
    const answer = a => {
      const ok = a === it.catches; c.sq = true;
      const btm = it.turn === BLACK;
      const lines = [`The pawn needs <b>${T.plural(n, 'move')}</b> to queen${it.double ? ' (its first move can be a double step)' : ''}. Black's king is <b>${T.plural(it.d, 'move')}</b> from ${nm64(56 + pf)}.`,
        btm ? `Black is to move, so stepping into the square in one move is enough: ${it.d <= n + 1 ? 'it can' : 'it can\'t'}.` : `White is to move, so the king must already be inside the square: ${it.d <= n ? 'it is' : 'it isn\'t'}.`,
        it.catches ? 'The king catches the pawn.' : 'The pawn queens.'];
      resolve(ok, ok ? 'Correct' : 'Not quite', `<p>${lines.join(' ')}</p>`);
    };
    return Object.assign(c, {
      prompt: () => ({ title: 'Can the black king catch the pawn?', sub: `${sideName(it.turn)} to move. White's king is too far away to help.`, side: it.turn }),
      view(){ const v = { pieces: posPieces(pos), cls: {}, rects: [] }; if (c.sq) v.rects.push(rect()); return v; },
      buttons: () => [{ label: 'Yes, it catches it', cls: 'ans', run: () => answer(true) }, { label: 'No, the pawn queens', cls: 'ans', run: () => answer(false) }],
      hint(){ c.sq = true; },
      timeout(){ answer(null); },
    });
  },

  // Forks, pins, skewers, combinations: play the winning line
  tactic(it){ return lineCtl(it, false); },
  trap(it){ return lineCtl(it, false); },

  // Play your side of an opening line from memory; each move comes with its idea
  oline(it){
    const pos = new Position(), me = it.side === 'w' ? WHITE : BLACK;
    const c = { pos, me, flip: me === BLACK, moves: true, sel: -1, targets: new Map(), k: 0, mistakes: 0, note: '', noteBad: false, hintIdea: false, arrows: null };
    const whyAt = k => it.why[Math.floor(k / 2)];     // learner moves are every other ply
    const myTurn = () => c.k < it.ucis.length && pos.turn === me;
    const mine = () => it.ucis.filter((_, k) => (k % 2 === 0) === (me === WHITE)).length;
    const finish = () => {
      const txt = it.sans.map((x, i) => (i % 2 ? '' : (i / 2 + 1) + '.') + x).join(' ');
      resolve(!c.failed, c.failed ? 'Line finished with the book moves shown' : c.mistakes ? `Line complete, with ${T.plural(c.mistakes, 'slip')}` : 'Line complete',
        `<p><b>${esc(it.fam)}: ${esc(it.name)}.</b> ${esc(T.openingData().families[it.fam] || '')}</p><p class="tip"><span class="mono">${esc(txt)}</span></p>`);
    };
    const opponent = async () => {
      while (c.k < it.ucis.length && pos.turn !== me){
        D.busy = true; await wait(450); if (!D || D.ctl !== c) return;
        play(c, pos.fromUci(it.ucis[c.k]), null); c.k++;
      }
      D.busy = false;
      if (c.k >= it.ucis.length) return finish();
      render();
    };
    c.move = m => {
      const uci = Position.uci(m), book = it.ucis[c.k], why = whyAt(c.k - (me === WHITE ? 0 : 1)), bookSan = it.sans[c.k];
      c.arrows = null; c.hintIdea = false;
      if (uci === book){
        play(c, m, 'good'); c.k++;
        c.note = `<b>${esc(bookSan)}</b> ${esc(why)}`; c.noteBad = false;
        return opponent();
      }
      // a different move: show it, take it back, then show the book move and why
      c.mistakes++;
      const san = pos.san(m), keep = { last: c.last };
      // why it isn't the move: does it lose material (engine), or is it just a different plan?
      const sm = C.scoreMoves(pos, 3), mine = sm.find(x => x.move === m), bk = sm.find(x => Position.uci(x.move) === book);
      const loses = mine && bk && bk.score - mine.score > 150;
      const reason = loses ? whyWrong(pos, m, false).replace(/<p class="tip">.*?<\/p>/g, '').replace(/<\/?p>/g, ' ').trim()
        : `<span class="mono">${esc(san)}</span> is playable, but it isn't the move this line teaches.`;
      play(c, m, 'bad'); D.busy = true;
      if (!c.failed){
        D.tries[D.k] = triesUsed() + 1;
        const left = maxTries() - D.tries[D.k];
        if (left > 0){
          setTimeout(() => {
            if (!D || D.ctl !== c) return;
            pos.unmake(); c.last = keep.last; c.mark = null; D.busy = false;
            c.note = `${reason} Idea of the right move: ${esc(why)} <b>${left === 1 ? 'One try left' : 'Two tries left'}.</b>`; c.noteBad = true;
            drawDots(); render();
          }, reduced ? 50 : 650);
          return;
        }
        c.failed = true; // out of tries: the book move is shown and the line goes on, but the drill counts as missed
      }
      setTimeout(async () => {
        if (!D || D.ctl !== c) return;
        pos.unmake(); c.last = null; c.mark = null;
        const bm = pos.fromUci(book);
        c.arrows = [[to64(mFrom(bm)), to64(mTo(bm)), 'good']];
        c.note = `${reason} The book move is <b>${esc(bookSan)}</b>: ${esc(why)}`; c.noteBad = true;
        render(); await wait(1500); if (!D || D.ctl !== c) return;
        c.arrows = null; play(c, bm, 'good'); c.k++;
        opponent();
      }, reduced ? 50 : 650);
    };
    // Black to play: White's first move comes first
    setTimeout(() => { if (D && D.ctl === c && !myTurn()) opponent(); }, 50);
    return Object.assign(c, {
      prompt(){
        const done = it.ucis.slice(0, c.k).filter((_, k) => (k % 2 === 0) === (me === WHITE)).length;
        const sub = c.hintIdea && myTurn() ? `<span class="onote">Idea: ${esc(whyAt(c.k - (me === WHITE ? 0 : 1)))}</span>`
          : c.note ? `<span class="onote${c.noteBad ? ' bad' : ''}">${c.note}</span>` : `Play ${sideName(me)}'s moves from memory. ${mine()} to play.`;
        return { title: `${it.fam}: ${it.name}`, sub: D.done ? '' : `<span class="mono">${done}/${mine()}</span> · ` + sub, side: me };
      },
      view: () => moveView(c),
      hint(){ c.hintIdea = true; },
    });
  },

  // Which opening is this?
  oname(it){
    const pos = new Position(it.fen), c = { gone: new Set() };
    const last = [C.sqFrom(it.last.slice(0, 2)), C.sqFrom(it.last.slice(2, 4))].map(to64);
    const reveal = (ok, pre) => resolve(ok, ok ? 'Correct' : 'Not quite', (pre || '') + `<p><b>${esc(it.answer)}.</b> ${esc(it.about)}</p>` + (it.deep ? `<p class="tip">${esc(it.line.why[it.line.why.length - 1])}</p>` : ''));
    // what the wrong choice actually is, so the next guess is an informed one
    const whatIs = o => {
      const O = T.openingData();
      if (!it.deep) return `<p>Not the ${esc(o)}: ${esc(O.families[o] || '')}</p>`;
      const L = O.lines.find(x => x.full === o), n = Math.min(L.sans.length, L.famPly + 4);
      return `<p>Not the ${esc(o)}. That one goes <span class="mono">${esc(T.moveText(L.sans.slice(0, n)))}…</span></p>`;
    };
    const answer = a => {
      if (a == null || a === it.answer) return reveal(a === it.answer);
      c.gone.add(a);
      const left = it.options.filter(o => !c.gone.has(o)).length;
      if (left <= 1){ D.tries[D.k] = maxTries(); return reveal(false, whatIs(a)); } // the last choice would be a giveaway
      wrong('Not quite', whatIs(a), w => reveal(false, w), () => {});
    };
    return Object.assign(c, {
      prompt: () => ({ title: it.deep ? 'Which variation is this?' : 'Which opening is this?', sub: `<span class="mono">${esc(it.moves)}</span>`, side: null }),
      view: () => { const v = { pieces: posPieces(pos), cls: {}, arrows: [], flip: false }; v.cls[last[0]] = 'last'; v.cls[last[1]] = 'last'; return v; },
      buttons: () => it.options.map(o => ({ label: esc(o), cls: 'opt' + (c.gone.has(o) ? ' gone' : ''), run: () => answer(o) })),
      hint(){ const no = it.options.filter(o => o !== it.answer && !c.gone.has(o)); no.slice(0, 2).forEach(o => c.gone.add(o)); },
      timeout(){ answer(null); },
    });
  },
  mate(it){ return lineCtl(it, true); },

  // Endgames against the exact tables
  eg(it){
    const pos = new Position(it.fen), me = pos.turn, c = { pos, me, flip: me === BLACK, moves: true, sel: -1, targets: new Map(), n: 0, arrows: null, hintSq: null };
    const limit = it.limit || it.moves;
    const bestFor = p => { const ms = T.egMoves(p); return ms[0]; };
    const tell = (ok, title, text) => { c.arrows = c.better ? [c.better] : null; resolve(ok, title, `<p>${text}</p>`); };
    // a move that throws the result away: explain, then take it back for another go (the right move only with the answer)
    const slip = (title, why, rightSan, keep) => {
      c.arrows = null;
      wrong(title, `<p>${why}</p>`, w => { c.arrows = c.better ? [c.better] : null; resolve(false, title, w + `<p><span class="mono">${esc(rightSan)}</span> was right.</p>`); },
        () => { pos.unmake(); c.n--; c.last = keep.last; c.mark = null; c.better = null; });
    };
    const reply = async () => {
      D.busy = true; await wait(380); if (!D || D.ctl !== c) return;
      const ms = T.egMoves(pos);
      let m;
      if (me === WHITE){ const top = ms[0].value === 0 ? ms.filter(x => x.value === 0) : ms.filter(x => x.value === ms[0].value); m = top[(Math.random() * top.length) | 0].move; }
      else {
        // White tries the move that leaves Black the fewest ways to hold
        let best = null, bestN = 99;
        for (const x of ms){ pos.make(x.move); const n = T.egMoves(pos).filter(y => y.value === 0).length; pos.unmake(); const n2 = n + Math.random() * .5; if (n2 < bestN){ bestN = n2; best = x.move; } }
        m = best;
      }
      play(c, m, null); D.busy = false;
      const st = pos.status();
      if (st && it.piece === 'P' && !it.win) return tell(true, 'Draw held', st.reason === 'stalemate' ? 'Stalemate: a draw.' : 'A draw.');
      render();
    };
    c.move = m => {
      const before = new Position(pos.fen()), san = pos.san(m), keep = { last: c.last };
      const alt = bestFor(before), mover = typeOf(before.b[mFrom(m)]);
      c.hintSq = null; c.arrows = null; c.n++;
      play(c, m, null);
      const st = pos.status(), v = T.egValue(pos);
      if (it.piece !== 'P'){
        if (st && st.reason === 'checkmate') return tell(true, 'Checkmate', `Mate in ${T.plural(c.n, 'move')}. The fastest possible from the start was ${it.best}.`);
        if (!v){ c.better = [to64(mFrom(alt.move)), to64(mTo(alt.move)), 'good'];
          const stale = st && st.reason === 'stalemate';
          return slip(stale ? 'Stalemate' : 'The win is gone', stale ? `After ${esc(san)} Black has no legal move but isn't in check: that's stalemate, a draw. Before every move, make sure the king still has a square or you're giving check.`
            : `After ${esc(san)} Black's king can take your ${it.piece === 'Q' ? 'queen' : 'rook'}: it's next to the king and your own king isn't guarding it.`, before.san(alt.move), keep); }
        if (c.n >= limit) return wrong('Out of moves', `<p>${T.plural(limit, 'move')} are up and Black's king is still on the board. Push the king to the edge first, then bring your own king up to help mate.</p><p>The ending starts again from the beginning.</p>`,
          w => tell(false, 'Out of moves', `${T.plural(limit, 'move')} are up and Black's king is still on the board. Mate was ${T.plural(Math.ceil((v - 1) / 2), 'move')} away.`));
        return reply();
      }
      if (it.win){
        if (mFlags(m) & F_PROMO){
          if (v > 0) return tell(true, 'Promoted', `${esc(san)}: the pawn is through and ${san.includes('=Q') ? 'king and queen' : 'this'} against king is a win.`);
          c.better = [to64(mFrom(alt.move)), to64(mTo(alt.move)), 'good'];
          return slip('The win is gone', st && st.reason === 'stalemate' ? `${esc(san)} is stalemate: Black has no move and isn't in check.` : `After ${esc(san)} the new piece can be taken, or it can't force mate.`, before.san(alt.move), keep);
        }
        if (!v){ c.better = [to64(mFrom(alt.move)), to64(mTo(alt.move)), 'good'];
          return slip('That lets Black draw', `After ${esc(san)} Black can hold the draw with correct play. ` + (mover === 1
            ? 'Pushing the pawn too early lets the black king get in front of it. Usually your king has to lead the way to the key squares first.'
            : 'Black\'s king can now take the opposition or get in front of the pawn. Look at where the kings face each other, and who is to move.'), before.san(alt.move), keep); }
        if (c.n >= limit) return wrong('Out of moves', '<p>The win is still there, but it is taking too long. Head for the queening square with your king in front of the pawn.</p><p>The ending starts again from the beginning.</p>',
          w => tell(false, 'Out of moves', 'The win is still there, but it is taking too long. Head for the queening square with your king in front.'));
        return reply();
      }
      // holding the draw as Black
      if (v > 0){ c.better = [to64(mFrom(alt.move)), to64(mTo(alt.move)), 'good'];
        return slip('That loses', `After ${esc(san)} White can force the pawn through. Keep your king in front of the pawn, and when the white king comes forward, step into the opposition (kings facing with one square between, White to move).`, before.san(alt.move), keep); }
      if (!T.egKey(pos) || T.egKey(pos).kind === 'draw') return tell(true, 'Pawn won', 'Only the kings are left: a draw.');
      if (st) return tell(true, 'Draw held', 'A draw.');
      if (c.n >= limit) return tell(true, 'Draw held', `${T.plural(limit, 'move')} and White has made no progress.`);
      return reply();
    };
    return Object.assign(c, {
      prompt(){
        const left = limit - c.n;
        if (it.piece !== 'P') return { title: `Mate with the ${it.piece === 'Q' ? 'queen' : 'rook'}`, sub: `Moves left: <b>${left}</b>. Black defends perfectly.`, side: WHITE };
        if (it.win) return { title: 'Promote the pawn', sub: `Black defends perfectly. Moves left: <b>${left}</b>.`, side: WHITE };
        return { title: 'Hold the draw', sub: `You are Black. Survive <b>${left}</b> more move${left === 1 ? '' : 's'}, or win the pawn.`, side: BLACK };
      },
      view: () => moveView(c),
      hint(){ const b = bestFor(pos); c.arrows = [[to64(mFrom(b.move)), to64(mTo(b.move)), 'move']]; },
    });
  },
};

// Tactics and mates: the solver plays the line; any move that keeps the forced mate is also right
function lineCtl(it, isMate){
  const pos = new Position(it.fen), me = pos.turn;
  const c = { pos, me, flip: me === BLACK, moves: true, sel: -1, targets: new Map(), step: 0, dyn: false, hintSq: null, arrows: null };
  if (it.last){ c.last = [C.sqFrom(it.last.slice(0, 2)), C.sqFrom(it.last.slice(2, 4))].map(to64); }
  const mateLeft = () => it.n - Math.floor(c.step / 2);
  const sans = (() => { const p = new Position(it.fen); return it.line.map(u => { const m = p.fromUci(u); const s = p.san(m); p.make(m); return s; }); })();
  const explain = () => it.kind === 'trap' ? `<p><b>${esc(it.name)}.</b> ${esc(it.text)}</p><p class="tip">Line: <span class="mono">${sans.map(esc).join(' ')}</span></p>` : isMate ? `<p>Mate in ${it.n}: <span class="mono">${sans.map(esc).join(' ')}</span></p>` : `<p>${esc(it.text)}</p><p class="tip">Line: <span class="mono">${sans.map(esc).join(' ')}</span> · wins ${it.gain} point${it.gain === 1 ? '' : 's'} of material</p>`;
  const showSolution = async (title, pre) => {
    D.done = false; D.busy = true; c.sel = -1; c.targets = new Map();
    // replay from the start
    const p0 = new Position(it.fen); c.pos = p0; c.last = null; c.mark = null; c.arrows = null; render();
    for (let k = 0; k < it.line.length; k++){ await wait(700); if (!D || D.ctl !== c) return; const m = c.pos.fromUci(it.line[k]); play(c, m, k % 2 ? null : 'good'); }
    D.busy = false;
    resolve(false, title, (pre || '') + explain());
  };
  c.move = m => {
    const uci = Position.uci(m);
    let ok = !c.dyn && (uci === it.line[c.step] || (!isMate && ((it.alts && it.alts[c.step / 2]) || []).includes(uci)));
    if (!ok && isMate){
      pos.make(m); const left = mateLeft() - 1, mated = !pos.legal().length && pos.inCheck();
      const still = mated || (left >= 1 && C.isMated(pos, left, { nodes: 400000 }) === true); pos.unmake();
      if (still){ ok = true; if (uci !== it.line[c.step]) c.dyn = true; }
    }
    if (!ok){
      const why = whyWrong(pos, m, isMate), keep = { last: c.last, mark: c.mark };
      play(c, m, 'bad'); D.busy = true;
      setTimeout(() => {
        if (!D || D.ctl !== c) return;
        wrong('Not quite', why, w => showSolution('Not quite', w + '<p>Here is the winning line.</p>'),
          () => { pos.unmake(); c.last = keep.last; c.mark = keep.mark; c.sel = -1; c.targets = new Map(); });
      }, reduced ? 50 : 700);
      return;
    }
    if (uci !== it.line[c.step] && !isMate) c.dyn = true;
    c.hintSq = null; c.arrows = null;
    play(c, m, 'good'); c.step++;
    if (pos.status() || (!c.dyn && c.step >= it.line.length) || (c.dyn && !isMate)) return resolve(true, isMate ? 'Checkmate' : 'Correct', explain());
    D.busy = true;
    setTimeout(() => {
      if (!D || D.ctl !== c) return;
      let reply;
      if (!c.dyn) reply = pos.fromUci(it.line[c.step]);
      else { let best = null, bestK = -1; const left = mateLeft(); for (const d of pos.legal()){ pos.make(d); let k = 0; for (let j = 1; j <= left; j++){ const r = C.mateIn(pos, j, { nodes: 200000 }); if (r && r !== -1){ k = j; break; } } pos.unmake(); if (k > bestK){ bestK = k; best = d; } } reply = best; }
      D.busy = false;
      if (!reply) return resolve(true, 'Correct', explain());
      play(c, reply, null); c.step++;
      render();
    }, reduced ? 50 : 520);
  };
  return Object.assign(c, {
    prompt(){
      const who = sideName(me);
      if (D.done) return { title: isMate ? `${who} to move: mate in ${it.n}` : `${who} to move`, sub: '', side: me };
      if (isMate) return { title: `${who} to move: mate in ${mateLeft()}`, sub: c.step ? 'Good. Keep going.' : 'Find the first move. Your opponent\'s best defence comes next.', side: me };
      if (it.kind === 'trap') return { title: `${who} to move. Punish the mistake`, sub: c.step ? 'Good. Keep going.' : `Your opponent just played <span class="mono">${esc(it.before[it.before.length - 1])}</span>.`, side: me };
      const label = { knightFork: 'Find the knight fork', fork: 'Find the fork', pin: 'Find the pin', skewer: 'Find the skewer', mixed: 'Win material', combo: 'Win material in two moves' }[it.set];
      return { title: `${who} to move. ${label}`, sub: c.step ? 'Good. Now collect.' : it.set === 'mixed' ? 'A fork, a pin or a skewer is hiding here.' : it.set === 'combo' ? 'Something forcing comes first: a check, a sacrifice or a capture.' : 'One move wins material.', side: me };
    },
    view: () => moveView(c),
    hint(){ const u = c.dyn ? null : it.line[c.step]; if (u) c.hintSq = to64(C.sqFrom(u.slice(0, 2))); else { const m = C.mateIn(pos, mateLeft(), { nodes: 400000 }); if (m && m !== -1) c.hintSq = to64(mFrom(m)); } },
    timeout(){ showSolution('Time is up', ''); },
  });
}

// ---------- boot ----------
drawMap();
GameNav.init({ id: 'trainer', note: () => D ? 'Leaving now ends this level.' : '',
  actions: () => [
    D && { icon: 'restart', label: D.custom ? `Restart the ${D.custom.kind === 'placement' ? 'placement test' : 'checkpoint'}` : 'Restart this level', note: 'New positions, score back to zero.', run: () => { const { tk, li, custom } = D; custom ? (custom.kind === 'placement' ? startPlacement() : startCheckpoint(custom.path)) : startLevel(tk, li); } },
    D && { icon: 'mode', label: 'All drills', note: 'Back to the list of levels.', run: backToMap },
  ] });

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !window.__swReloaded){ window.__swReloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
